name: Record Daily Red results

# Every run records all open "Daily Red #" issues, so there is no title filter here:
# a run that is skipped or cancelled while another waits is covered by the next one.
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# GitHub keeps one waiting run per group and cancels older waiting runs. That is fine,
# because the run that is kept handles their issues too.
concurrency:
  group: results-file
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      # the latest main, not the commit from when the issue was opened
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record open result issues
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/record-result.js');
            await run({ github, context, exec, core });
